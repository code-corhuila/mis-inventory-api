name: Inventory checks
on:
  pull_request:
    branches: [develop, qa]
permissions:
  contents: read
concurrency:
  group: inventory-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify published modules
        run: mvn -B verify
