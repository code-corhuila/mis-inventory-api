name: Inventory checks
on:
  pull_request:
    branches: [develop, qa]
permissions:
  contents: read
concurrency:
  group: inventory-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify published modules
        run: mvn -B verify
      - name: Validate OpenAPI
        run: |
          python3 -m pip install PyYAML==6.0.3 jsonschema==4.26.0 openapi-spec-validator==0.9.0
          python3 tests/check_contracts.py
      - name: Parse persistence acceptance script
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          foreach($script in @('Test-Persistence.ps1','Test-Access.ps1','Test-Integration.ps1','Test-Publication.ps1')) {
            [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/tests/$script",[ref]$tokens,[ref]$errors)
            if($errors.Count) { throw ($errors -join "`n") }
          }
