services:
  inventory:
    image: ${INVENTORY_IMAGE:-mis-inventory:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      INVENTORY_DB_URL: jdbc:postgresql://postgres:5432/${PG_DATABASE:?PG_DATABASE required}
      INVENTORY_DB_PASSWORD: ${INVENTORY_APP_PASSWORD:?INVENTORY_APP_PASSWORD required}
      INVENTORY_JWKS_URL: http://security:8080/api/v1/auth/jwks
      INVENTORY_CATALOG_URL: http://catalog:8080
      INVENTORY_SUPPLIERS_URL: http://suppliers:8080
    depends_on:
      inventory-db-migrate:
        condition: service_completed_successfully
      security:
        condition: service_healthy
      catalog:
        condition: service_healthy
      suppliers:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, 'http://localhost:8080/health']
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s
    networks: [platform]
    restart: unless-stopped
    stop_grace_period: 20s
